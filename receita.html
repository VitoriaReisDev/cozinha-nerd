<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receita - Cozinha Nerd</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">Cozinha Nerd</div>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
            </ul>
        </nav>
    </header>

    <main class="container" style="padding: 40px; max-width: 800px;">
        <a href="index.html" style="color: var(--primary-neon); text-decoration: none; font-weight: 700;">← Voltar às receitas</a>
        
        <h1 id="titulo-receita" style="color: var(--primary-neon); margin-top: 20px; font-size: 32px;"></h1>
        
        <div style="margin: 20px 0;">
            <img id="imagem-receita" src="" alt="" style="width: 100%; max-height: 400px; object-fit: cover; border-radius: 18px; border: 1px solid var(--purple-glow);">
        </div>

        <div style="background-color: var(--bg-card); padding: 25px; border-radius: 18px; border: 1px solid rgba(168, 85, 247, 0.4); margin-bottom: 20px;">
            <h3 style="color: var(--purple-glow); margin-bottom: 10px;">Ingredientes:</h3>
            <ul id="lista-ingredientes" style="color: var(--text-light); padding-left: 20px; line-height: 1.8;"></ul>
        </div>

        <div style="background-color: var(--bg-card); padding: 25px; border-radius: 18px; border: 1px solid rgba(168, 85, 247, 0.4);">
            <h3 style="color: var(--purple-glow); margin-bottom: 10px;">Modo de Preparação:</h3>
            <p id="modo-preparo" style="color: var(--text-light); line-height: 1.8;"></p>
        </div>
    </main>

    <footer>
        <p style="text-align: center; padding: 30px; color: #b2a3c7; font-size: 13px;">Sugestão de receitas? Envie um e-mail para receitas@cozinhanerd.com</p>
    </footer>

    <script>
        const receitas = {
            "macarrao": {
                titulo: "Macarrão com Almôndegas da Dama e o Vagabundo",
                imagem: "fotos/macarrao.jpg",
                ingredientes: [
                    "500g de espaguete",
                    "400g de carne moída",
                    "1 ovo",
                    "1/2 xícara de farinha de rosca",
                    "2 xícaras de molho de tomate caseiro",
                    "Queijo parmesão ralado a gosto"
                ],
                preparo: "Tempere a carne moída, misture com o ovo e a farinha de rosca e molde as almôndegas. Frite até dourar. Adicione o molho de tomate e deixe cozinhar. Cozinhe o espaguete em água fervente com sal até ficar al dente. Sirva a massa com as almôndegas e o molho por cima, finalizando com parmesão."
            },
            "cupcake": {
                titulo: "Cupcake da Natsuki de Doki Doki Literature Club",
                imagem: "fotos/cupcake.jpg",
                ingredientes: [
                    "2 xícaras de farinha de trigo",
                    "1 xícara de açúcar",
                    "1/2 xícara de manteiga",
                    "2 ovos",
                    "1/2 xícara de leite",
                    "1 colher de sopa de fermento",
                    "Chantilly e confeitos rosa para decorar"
                ],
                preparo: "Bata a manteiga com o açúcar até obter um creme claro. Adicione os ovos um a um. Intercale a farinha de trigo com o leite e por último adicione o fermento. Distribua em forminhas de cupcake e asse a 180°C por 20 minutos. Deixe esfriar e decore com chantilly e confeitos decorativos."
            },
            "cerveja": {
                titulo: "Cerveja Amanteigada de Harry Potter",
                imagem: "fotos/cerveja.jpg",
                ingredientes: [
                    "500ml de guaraná ou soda",
                    "2 colheres de sopa de manteiga sem sal",
                    "1/2 xícara de açúcar mascavo",
                    "1/2 xícara de creme de leite",
                    "1 colher de chá de essência de baunilha"
                ],
                preparo: "Derreta a manteiga com o açúcar mascavo numa panela em fogo baixo até formar uma calda. Misture o creme de leite e a essência de baunilha até ficar homogêneo e deixe esfriar. Coloque a mistura cremosa nos copos e complete suavemente com o refrigerante bem gelado."
            },
            "hamburguer": {
                titulo: "Hambúrguer de Siri do Bob Esponja",
                imagem: "fotos/hamburguer.jpg",
                ingredientes: [
                    "Pão de hambúrguer com gergelim",
                    "200g de hambúrguer artesanal",
                    "Fatias de queijo prato",
                    "Alface crespa e tomate em rodelas",
                    "Picles e cebola roxa",
                    "Molho secreto (maionese, ketchup e mostarda)"
                ],
                preparo: "Grelhe o hambúrguer na chapa até o ponto desejado e derreta o queijo por cima. Monte o pão selado com a maionese especial, a carne com queijo, alface, tomate, picles e rodelas de cebola. Sirva quente!"
            },
            "lamen": {
                titulo: "Lamen do Naruto (Ramen do Ichiraku)",
                imagem: "fotos/lamen.jpg",
                ingredientes: [
                    "1 pacote de macarrão para lamen",
                    "500ml de caldo de galinha ou suíno bem temperado",
                    "Fatias de lombo suíno (Chashu)",
                    "1 ovo cozido com gema mole",
                    "Fatias de Naruto (massa de peixe/Narutomaki)",
                    "Cebolinha picada e alga nori"
                ],
                preparo: "Aqueça o caldo temperado com shoyu e missô. Cozinhe o macarrão para lamen à parte e coloque-o na tigela. Despeje o caldo bem quente sobre a massa. Monte por cima as fatias de lombo, o ovo cortado ao meio, o Narutomaki, a cebolinha e a folha de nori na lateral."
            },
            "matilda": {
                titulo: "Bolo de Chocolate da Matilda",
                imagem: "fotos/Matilda.jpg",
                ingredientes: [
                    "300 ml de leite e 15 ml de vinagre de álcool (buttermilk)",
                    "4 ovos",
                    "255g de açúcar mascavo",
                    "80ml de óleo",
                    "67g de cacau em pó",
                    "240g de farinha de trigo",
                    "7g de bicarbonato de sódio e 7g de fermento químico",
                    "Recheio/Cobertura: 650g de chocolate ao leite, água quente, café solúvel, creme de leite e manteiga"
                ],
                preparo: "Misture o leite com o vinagre por 10 minutos. Adicione os ovos, o açúcar, o óleo e o buttermilk. Incorpore os ingredientes secos peneirados (cacau, farinha, bicarbonato e fermento). Asse a 200ºC por 45 minutos. Prepare a ganache batendo o chocolate derretido com o café, cacau, creme de leite e manteiga aos poucos. Monte o bolo em camadas regando com calda de açúcar e recheando com a ganache."
            },
            "lasanha": {
                titulo: "Lasanha do Garfield",
                imagem: "fotos/lasanha.jpg",
                ingredientes: [
                    "2 colheres (sopa) de azeite de oliva",
                    "1 cebola, 2 talos de salsão e 1 cenoura picadinhos",
                    "1kg de carne moída",
                    "300ml de tomates sem pele amassados",
                    "250ml de caldo de galinha",
                    "12 folhas de massa para lasanha",
                    "Molho branco: 50g de manteiga, 50g de farinha e 600-900ml de leite",
                    "5 colheres (sopa) de queijo parmesão ralado",
                    "Sal, pimenta-do-reino e pimenta-branca a gosto"
                ],
                preparo: "Refogue a cebola, o salsão e a cenoura no azeite até ficarem macios. Adicione a carne moída e frite bem. Acrescente os tomates, os legumes e o caldo de galinha, deixando ferver por 30 minutos em fogo baixo até reduzir o líquido. Para o molho branco, derreta a manteiga, acrescente a farinha e vá colocando o leite aos poucos até engrossar, temperando a gosto. Monte a lasanha intercalando molho à bolonhesa, massa e molho branco por 3 camadas, finalize com parmesão e asse a 220°C por 25 minutos até dourar."
            },
            "donut": {
                titulo: "Donuts do Homer Simpson",
                imagem: "fotos/donut.jpg",
                ingredientes: [
                    "4 xícaras de farinha de trigo",
                    "2 xícaras de leite morno",
                    "2 ovos",
                    "2 colheres (sopa) de manteiga derretida",
                    "2 colheres (sopa) de fermento",
                    "1 colher (sopa) de açúcar",
                    "Óleo para fritar",
                    "Glacê: 2 claras, açúcar refinado a gosto, corante rosa e gotas de limão (opcional)",
                    "Granulado colorido para decorar"
                ],
                preparo: "Junte a farinha, o leite, os ovos, a manteiga, o fermento e o açúcar até formar uma massa homogênea. Deixe descansar por 30 minutos. Abra a massa, corte no formato de rosquinha e deixe descansar por mais 20 minutos. Frite em óleo quente até dourar e escorra em papel absorvente. Para a cobertura, bata as claras com o açúcar refinado, o corante rosa e o limão até obter o ponto de glacê. Confeite os donuts com o glacê rosa e finalize com granulado colorido!"
            },
            "cafe": {
                titulo: "Café da Manhã Mágico de O Castelo Animado",
                imagem: "fotos/cafe.jpg",
                ingredientes: [
                    "3 fatias grossas de bacon",
                    "2 ovos",
                    "2 fatias de pão rústico",
                    "50g de queijo (prato, cheddar ou curado)",
                    "1/2 colher (sopa) de manteiga",
                    "Pitada de sal e pimenta-do-reino moída"
                ],
                preparo: "Frite as fatias de bacon em fogo médio até ficarem douradas e crocantes, reservando-as num prato. Na mesma frigideira com a gordura do bacon, quebre os 2 ovos, tempere com sal e pimenta e cozinhe até a clara firmar. Passe a manteiga nos pães rústicos e toste até dourar dos dois lados. Monte o prato servindo o bacon crocante, os ovos e o pão bem quente, acompanhados das fatias de queijo!"
            },
            "torta": {
                titulo: "Torta de Manteiga Escocesa do Pica-Pau",
                imagem: "fotos/torta.jpg",
                ingredientes: [
                    "Base: 150g de biscoito maisena sabor chocolate e 100g de manteiga",
                    "Caramelo: 1/2 xícara de açúcar, 75g de manteiga, 1 lata de leite condensado, 1 caixa de creme de leite e 1 pitada de sal",
                    "Cobertura: 200g de chocolate meio amargo derretido"
                ],
                preparo: "Processe os biscoitos de chocolate até virar farofa, misture com a manteiga, forre o fundo de uma forma com papel-manteiga e leve à geladeira por 10 minutos. Para o caramelo, derreta o açúcar até dourar, acrescente a manteiga e depois o leite condensado, o creme de leite e o sal, cozinhando por 15 minutos sem parar de mexer. Despeje o caramelo sobre a base e nivele. Cubra tudo com o chocolate meio amargo derretido, leve à geladeira por 4 horas para firmar, corte em pedaços e sirva!"
            },
            "biscoito": {
                titulo: "Biscoito Gatinho do Steven Universo",
                imagem: "fotos/biscoito.jpg",
                ingredientes: [
                    "115g de manteiga sem sal em temperatura ambiente",
                    "150g de açúcar",
                    "1 ovo",
                    "1 colher (chá) de extrato de baunilha",
                    "190g de farinha de trigo",
                    "40g de cacau em pó",
                    "1/2 colher (chá) de fermento em pó",
                    "1/3 colher (chá) de sal",
                    "500ml de sorvete de baunilha (ou morango/baunilha)"
                ],
                preparo: "Misture a farinha, o cacau, o fermento e o sal. Bata a manteiga com o açúcar até ficar cremoso, depois junte o ovo e a baunilha. Adicione os ingredientes secos até formar uma massa lisa e leve à geladeira embrulhada em filme plástico. Abra a massa com 5mm de espessura, corte no formato de gatinhos e desenhe o rostinho com um palito. Asse a 180°C até as bordas firmarem e deixe esfriar completamente. Recheie dois biscoitos com uma camada generosa de sorvete e leve ao congelador até firmar!"
            },
            "panquecas": {
                titulo: "Panquecas de Toicinho do Jake (Hora de Aventura)",
                imagem: "fotos/panquecas.jpg",
                ingredientes: [
                    "200g de farinha de trigo",
                    "1 colher (sopa) de açúcar",
                    "2 colheres (chá) de fermento em pó",
                    "1/3 colher (chá) de sal",
                    "250ml de leite",
                    "1 ovo",
                    "2 colheres (sopa) de manteiga derretida",
                    "8 fatias de bacon",
                    "100ml de xarope de bordo (maple syrup) ou mel"
                ],
                preparo: "Frite o bacon até dourar levemente e reserve a frigideira com a gordura. Misture os ingredientes secos em uma tigela e os líquidos em outra; junte ambos sem bater muito. Despeje uma concha de massa na frigideira aquecida, coloque duas tiras de bacon por cima apertando levemente e, quando surgirem bolhas, vire para dourar o outro lado. Empilhe as panquecas e sirva quentinhas regadas com mel ou xarope!"
            },
            "sanduiche": {
                titulo: "Sanduíche Mortal de Apenas um Show",
                imagem: "fotos/sanduiche.jpg",
                ingredientes: [
                    "2 pães tipo submarino ou baguete (25cm)",
                    "100g de salame fatiado",
                    "100g de presunto fatiado",
                    "100g de queijo provolone ou muçarela fatiado",
                    "1 tomate médio em rodelas",
                    "1/2 cebola roxa em fatias finas",
                    "4 folhas de alface",
                    "2 colheres (sopa) de pimenta jalapeño em conserva",
                    "2 colheres (sopa) de maionese",
                    "1 colher (sopa) de mostarda",
                    "1/2 colher (chá) de molho de pimenta (opcional)"
                ],
                preparo: "Abra os pães ao meio sem separar totalmente. Misture a maionese, a mostarda e o molho de pimenta e espalhe nos pães. Monte as camadas de salame, presunto e queijo e leve ao forno a 200°C ou à sanduicheira até o queijo derreter e o pão ficar crocante. Finalize com as folhas de alface, rodelas de tomate, cebola roxa e a pimenta jalapeño em conserva. Feche, pressione levemente, corte ao meio e sirva!"
            },
            "queijo": {
                titulo: "Macarrão com Queijo de Todo Mundo Odeia o Chris",
                imagem: "fotos/queijo.jpg",
                ingredientes: [
                    "400g de macarrão cotovelo",
                    "3 colheres (sopa) de manteiga",
                    "3 colheres (sopa) de farinha de trigo",
                    "500ml de leite",
                    "250g de queijo cheddar ralado",
                    "150g de queijo prato ou muçarela ralado",
                    "30g de queijo parmesão ralado",
                    "1/2 colher (chá) de sal",
                    "1/3 colher (chá) de pimenta-do-reino moída",
                    "1/2 colher (chá) de páprica"
                ],
                preparo: "Cozinhe o macarrão al dente e reserve. Derreta a manteiga numa panela, junte a farinha e mexa por 1 minuto. Adicione o leite aos poucos mexendo sempre até engrossar e tempere com sal, pimenta e páprica. Fora do fogo, misture o cheddar e metade do queijo prato ao molho até derreter. Incorpore o macarrão, transfira para um refratário, cubra com o restante do queijo prato e com o parmesão e asse a 180°C até dourar por cima!"
            },
            "gelatina": {
                titulo: "Gelatina de Café do Saiki Kusuo",
                imagem: "fotos/gelatina.jpg",
                ingredientes: [
                    "500ml de café forte coado",
                    "12g de gelatina em pó sem sabor (1 envelope)",
                    "4 colheres (sopa) de água fria (para hidratar)",
                    "3 colheres (sopa) de açúcar",
                    "200ml de creme de leite fresco gelado",
                    "1 colher (sopa) de açúcar de confeiteiro"
                ],
                preparo: "Hidrate a gelatina sem sabor na água fria. Aqueça o café forte com as 3 colheres de açúcar até quase ferver, desligue o fogo, adicione a gelatina hidratada e mexa bem até dissolver. Despeje num refratário e leve à geladeira até firmar. Para o creme, bata o creme de leite fresco gelado com o açúcar de confeiteiro até formar um chantilly leve. Corte a gelatina em cubos, distribua em taças e cubra com o creme bem gelado!"
            },
            "ensopado": {
                titulo: "Ensopado do acampamento de Red Dead Redemption 2",
                imagem: "fotos/ensopado.jpg",
                ingredientes: [
                    "800g de carne bovina em cubos (acém ou músculo)",
                    "3 batatas médias em cubos",
                    "2 cenouras em rodelas grossas",
                    "1 cebola grande picada",
                    "3 dentes de alho picados",
                    "2 colheres (sopa) de extrato de tomate",
                    "1 litro de caldo de carne",
                    "2 colheres (sopa) de óleo",
                    "2 folhas de louro",
                    "1 colher (chá) de sal e 1/2 colher (chá) de pimenta-do-reino"
                ],
                preparo: "Tempere a carne com sal e pimenta e doure em uma panela quente com óleo por etapas. Reserve a carne e refogue a cebola e o alho na mesma panela. Adicione o extrato de tomate e mexa por 1 minuto. Devolva a carne, junte o caldo de carne e as folhas de louro, deixando cozinhar em fogo baixo até a carne amolecer. Acrescente as batatas e cenouras e cozinhe até ficarem macias e o caldo encorpar. Sirva bem quente com pão rústico como na beira da fogueira!"
            },
            "onigiri": {
                titulo: "Onigiri da Chihiro (A Viagem de Chihiro)",
                imagem: "fotos/onigiri.jpg",
                ingredientes: [
                    "300g de arroz japonês (grão curto)",
                    "360ml de água para o cozimento",
                    "1 colher (chá) de sal fino",
                    "2 folhas de alga nori cortadas em tiras",
                    "100g de salmão grelhado e desfiado (recheio opcional)"
                ],
                preparo: "Lave o arroz japonês trocando a água até que fique quase transparente. Cozinhe com a água em panela tampada até secar e deixe descansar para soltar o vapor. Com o arroz morno, molhe as mãos com água e passe o sal fino pelas palmas. Modele o arroz em formato triangular ou de bolinha (adicionando o salmão no centro, se desejar rechear) pressionando suavemente. Finalize envolvendo a base de cada onigiri com uma tira de alga nori e sirva!"
            }
        };

        const parametros = new URLSearchParams(window.location.search);
        const idReceita = parametros.get('id');

        if (idReceita && receitas[idReceita]) {
            const dados = receitas[idReceita];
            
            document.getElementById('titulo-receita').textContent = dados.titulo;
            document.getElementById('imagem-receita').src = dados.imagem;
            document.getElementById('imagem-receita').alt = dados.titulo;
            document.getElementById('modo-preparo').textContent = dados.preparo;

            const listaUl = document.getElementById('lista-ingredientes');
            dados.ingredientes.forEach(ingrediente => {
                const li = document.createElement('li');
                li.textContent = ingrediente;
                listaUl.appendChild(li);
            });
        } else {
            document.getElementById('titulo-receita').textContent = "Receita não encontrada!";
            document.getElementById('modo-preparo').textContent = "Por favor, volte à página inicial e selecione uma receita válida.";
        }
    </script>
</body>
</html>
